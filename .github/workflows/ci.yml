name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Deploys are handled by Vercel's native Git integration (vercel[bot]),
# which builds with the project's environment variables. This workflow is
# only the code-quality gate.
jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check
